<html>
<head>
  <!-- Coding By Trideep Chakrabartty -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Registration Form Using HTML & CSS || Trideep Chakrabartty</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
          <div class="conatiner">
            <h3 class="heading">Registration</h3>
            <div class="info_area">
                <div class="area">
                    <div class="input">
                      <label for="fname">Full Name</label>
                      <input type="text" name="fname" required>
                    </div>

                    <div class="input">
                      <label for="username">Username</label>
                      <input type="text" name="username" required>
                    </div>
                </div>

                <div class="area">
                  <div class="input">
                    <label for="email">Your E-mail</label>
                    <input type="email" name="username" required>
                  </div>

                  <div class="input ph">
                    <label for="number">Phone Number</label>
                    <input type="number" name="number" required>
                  </div>
                </div>

                <div class="area">
                  <div class="input">
                    <label for="password">Your Password</label>
                    <input type="password" name="password" required>
                  </div>

                  <div class="input co">
                    <label for="confirm_password">Confirm Your Password</label>
                    <input type="password" name="confirm_password" required>
                  </div>
                </div>

                <div class="gender">
                  <p>Gender</p>

                  <input type="radio" name="male" value="1">
                  <label for="">Male</label>


                  <input type="radio" name="female" value="2">
                  <label for="">Female</label>


                  <input type="radio" name="custom" value="6">
                  <label for="">Custom</label>

                </div>
            </div>
          </div>

</body>
</html>
