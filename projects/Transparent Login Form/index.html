<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA==" crossorigin="anonymous" />
</head>
<body>
    <div class="form">
        <h2>Login Form</h2>

        <label for="E-mail">
            <input type="text" placeholder="E-mail Or Phone Number">
        </label>
                <br>
        <label for="password">
            <input type="password" placeholder="Type You Password">
        </label>

        <h4>Forgot Password ?</h4>

       <div class="login">
        <button>LOGIN</button>

       </div>

      <p> Or Login With </p>

      <div class="alternative">
        <button class="fb"> <span><i class="fab fa-facebook-f"></i></span> Facebbok</button>

        <button class="insta"> <span><i class="fab fa-instagram"></i></span> Instagram</button>
      </div>
        
      <p>Don't You have any account? <span>Sign Up</span></p>
        
    </div>
</body>
</html>
